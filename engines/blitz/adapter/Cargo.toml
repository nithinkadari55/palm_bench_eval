[package]
name = "adapter-blitz"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "adapter-blitz"
path = "src/main.rs"

[dependencies]
blitz-dom = { workspace = true, features = ["svg", "floats", "system-fonts", "woff", "complex-scripts", "text-transform-icu", "writing-mode"] }
blitz-html = { workspace = true }
blitz-traits = { workspace = true }
blitz-paint = { workspace = true, features = ["default"] }
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true }
peniko = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
data-url = { workspace = true }
png = { workspace = true }
serde_json = { workspace = true }
