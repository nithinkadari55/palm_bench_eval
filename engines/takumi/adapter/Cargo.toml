[package]
name = "adapter-takumi"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "adapter-takumi"
path = "src/main.rs"

[dependencies]
cssparser.workspace = true
log.workspace = true
serde_json.workspace = true
encoding_rs = "0.8"
url = "2"

[dependencies.takumi]
path = "../takumi"
features = ["from-html"]

[dependencies.takumi-pdf]
path = "../takumi-pdf"
