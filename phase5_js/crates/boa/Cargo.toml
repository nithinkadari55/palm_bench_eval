[package]
name = "p5-boa"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "p5-boa"
path = "src/main.rs"

[dependencies]
# Default features (float16, xsum, temporal) plus Annex B (web-legacy built-ins the libraries
# and test262 annexB need) and Intl with the bundled ICU4X data.
boa_engine = { version = "=0.22.0", features = ["annex-b", "intl_bundled"] }
serde_json = "=1.0.154"
p5-common = { path = "../common" }

[profile.release]
debug = 1
panic = "unwind"
