[package]
name = "p4-krilla07"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["k07"]
k07 = []

[[bin]]
name = "gen"
path = "../shared/gen.rs"

[[bin]]
name = "robust"
path = "../shared/robust.rs"

[dependencies]
krilla = { version = "=0.7.0", default-features = false, features = ["raster-images", "simple-text"] }
rustybuzz = "=0.20.1"
serde_json = "=1.0.154"

[profile.release]
debug = false
